// apiKey = JSONBin master key (localStorage-ban)
// roomId = JSONBin bin ID = szoba kulcs (localStorage-ban)

const LS_KEY    = “bang_apikey”;
const LS_ROOM   = “bang_roomid”;
const LS_RNAME  = “bang_roomname”;
const HARDCODED_KEY = “$2a$10$ZDenCcJ13BdgbQWFeu0j8.rlKpq2v0eKQ6i4AeaqTKloihDsCNtNS”;

const jbHdrs = key => ({ “Content-Type”:“application/json”, “X-Master-Key”:key });

async function jbRead(binId, apiKey) {
const r = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
headers:{“X-Master-Key”:apiKey}
});
if(!r.ok) throw new Error(r.status);
return (await r.json()).record;
}

async function jbWrite(binId, apiKey, data) {
const r = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
method:“PUT”, headers:jbHdrs(apiKey), body:JSON.stringify(data)
});
if(!r.ok) throw new Error(r.status);
}

async function jbCreate(apiKey, roomName) {
const r = await fetch(“https://api.jsonbin.io/v3/b”, {
method:“POST”,
headers:{…jbHdrs(apiKey),“X-Bin-Name”:`BANG-${roomName}`,“X-Bin-Private”:“false”},
body:JSON.stringify({players:[],games:[]})
});
if(!r.ok) throw new Error(r.status);
return (await r.json()).metadata.id;
}

if(!roomName.trim()){setErr(“Add meg a szoba nevét!”); return;}
setLoading(true); setErr(””);
try {
const id = await jbCreate(apiKey, roomName.trim());
setCreated({id, name:roomName.trim()});
} catch(e) {
setErr(“Hiba a szoba létrehozásakor: “ + e.message);
}
setLoading(false);
};

const joinRoom = async () => {
const key = roomKey.trim();
if(!key){setErr(“Add meg a szoba kulcsát!”); return;}
setLoading(true); setErr(””);
try {
const d = await jbRead(key, apiKey);
if(!d||!Array.isArray(d.players)) throw new Error(“Érvénytelen szoba”);
localStorage.setItem(LS_ROOM, key);
localStorage.setItem(LS_RNAME, “Szoba”);
onJoin(key, “Szoba”, d.players, d.games);
} catch(e) {
setErr(“Nem található ez a szoba. Ellenőrizd a kulcsot!”);
}
setLoading(false);
};

localStorage.setItem(LS_ROOM, created.id);
localStorage.setItem(LS_RNAME, created.name);
onJoin(created.id, created.name, [], []);

// ── FŐ APP ────────────────────────────────────────────────────────────────────

const ROLES = {
seriff:    { label:“Seriff”,    icon:“🤠”, color:”#e8b84b”, dark:”#3a2408”, team:“seriff”,  base:3.5 },
helyettes: { label:“Helyettes”, icon:“⭐”, color:”#c89030”, dark:”#2e1c06”, team:“seriff”,  base:3.5 },
bandita:   { label:“Bandita”,   icon:“💀”, color:”#e05050”, dark:”#380c0c”, team:“bandita”, base:5.0 },
renegat:   { label:“Renegát”,   icon:“🃏”, color:”#50c878”, dark:”#0c3018”, team:“renegat”, base:10.0 },
};
// Szerepenkénti pontok létszám szerint (matematikailag kiegyensúlyozott)
// Várható érték (győzési% × pont) minden szerepnél ~1.5 pt/játék
// 5 fős: Seriff/Helyettes ~45%, Bandita ~30%, Renegát ~15%
// 6 fős: Seriff ~45%, Helyettes ~35% (titkos, 2v4!), Bandita ~25% (2v3), Renegát ~10%
const ROLE_PTS = {
seriff:    { 5: 3.5, 6: 3.5 },
helyettes: { 5: 3.5, 6: 4.5 },
bandita:   { 5: 5.0, 6: 6.0 },
renegat:   { 5: 10.0, 6: 15.0 },
};
const CONFIGS = {
5: { slots:[“seriff”,“helyettes”,“bandita”,“bandita”,“renegat”] },
6: { slots:[“seriff”,“helyettes”,“helyettes”,“bandita”,“bandita”,“renegat”] },
};
const WIN_TEAMS = {
seriff:  { label:“Seriff csapata”, icon:“🤠”, color:”#e8b84b” },
bandita: { label:“Banditák”,       icon:“💀”, color:”#e05050” },
renegat: { label:“Renegát”,        icon:“🃏”, color:”#50c878” },
};

function calcPts(role, winTeam, pc) {
const r = ROLES[role]; if (!r || r.team !== winTeam) return 0;
return ROLE_PTS[role]?.[pc] || r.base;
}

function buildLB(players, games) {
const s = {};
players.forEach(p => {
s[p.id] = { id:p.id, name:p.name, pts:0, wins:0, played:0,
roles:{}, teamStats:{}, pcStats:{5:{p:0,w:0},6:{p:0,w:0}},
streak:0, maxStreak:0, maxLoseStreak:0, teammates:{},
nemesis:{}, // pid -> hányszor nyert ellenünk
scoreHistory:[] // [{date,pts,cumPts}]
};
});
[…games].reverse().forEach(g => {
const teamOf = {};
g.assignments.forEach(a => { teamOf[a.pid] = ROLES[a.role]?.team; });
g.assignments.forEach(a => {
const st = s[a.pid]; if (!st) return;
const pts = calcPts(a.role, g.winTeam, g.pc);
const won = pts > 0;
st.pts += pts; st.played++;
if (won) st.wins++;
st.roles[a.role] = (st.roles[a.role]||0) + 1;
const team = ROLES[a.role]?.team;
if (team) {
if (!st.teamStats[team]) st.teamStats[team] = {p:0,w:0};
st.teamStats[team].p++; if (won) st.teamStats[team].w++;
}
if (st.pcStats[g.pc]) { st.pcStats[g.pc].p++; if(won) st.pcStats[g.pc].w++; }
if (won) {
g.assignments.forEach(b => {
if (b.pid===a.pid || teamOf[b.pid]!==team) return;
st.teammates[b.pid] = (st.teammates[b.pid]||0) + 1;
});
} else {
// vereség: kik voltak a győztes csapaton (ők a “nemezis” jelöltek)
g.assignments.forEach(b => {
if (b.pid===a.pid) return;
if (ROLES[b.role]?.team === g.winTeam) {
st.nemesis[b.pid] = (st.nemesis[b.pid]||0) + 1;
}
});
}
});
});
// Streak + scoreHistory (játékok időrendben: games[0]=legújabb, reverse=legrégebbi először)
players.forEach(p => {
if (!s[p.id]) return;
let cumPts=0;
// scoreHistory: legrégebbitől legújabbig (chart-hoz)
[…games].reverse().forEach(g => {
const a = g.assignments.find(x=>x.pid===p.id); if (!a) return;
const pts = calcPts(a.role,g.winTeam,g.pc);
cumPts += pts;
s[p.id].scoreHistory.push({date:g.date, pts, cumPts});
});
// Streak: legújabb játéktól visszafelé (games[0] = legújabb)
let streak=0, maxW=0, maxL=0, cur=0, curL=0;
for (const g of games) {
const a = g.assignments.find(x=>x.pid===p.id); if (!a) continue;
const won = calcPts(a.role,g.winTeam,g.pc) > 0;
if (won) { cur++; maxW=Math.max(maxW,cur); curL=0; }
else     { curL++; maxL=Math.max(maxL,curL); cur=0; }
}
// Jelenlegi sorozat: legújabbtól az első megszakadásig (nem játszott meccsek átugorva)
for (const g of games) {
const a = g.assignments.find(x=>x.pid===p.id); if (!a) continue;
const won = calcPts(a.role,g.winTeam,g.pc) > 0;
if (won) streak++;
else break;
}
s[p.id].streak=streak; s[p.id].maxStreak=maxW; s[p.id].maxLoseStreak=maxL;
});
return Object.values(s).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);
}

function App({apiKey, roomId, roomName, initPlayers, initGames, onLeaveRoom}) {

const [games,    setGames]    = useState([]);
const [view,     setView]     = useState(“lb”);
const [toast,    setToast]    = useState(null);
const [expanded, setExpanded] = useState(null);
const [stab,     setStab]     = useState(“players”);
const [newName,  setNewName]  = useState(””);
const [pc,       setPc]       = useState(5);
const [assign,   setAssign]   = useState({});
const [winner,   setWinner]   = useState(””);
const [date,     setDate]     = useState(new Date().toISOString().slice(0,10));
const [rounds,   setRounds]   = useState(””);
const [syncStatus, setSyncStatus] = useState(“idle”); // idle|saving|ok|err
const [lastSync,   setLastSync]   = useState(null);

// ── SZOBA / JSONBIN SYNC ─────────────────────────────────────────────

const notify = (msg, err=false) => {
setToast({msg,err}); setTimeout(()=>setToast(null),3000);
};

// Betöltés induláskor — initData-ból vagy JSONBin-ből
useEffect(()=>{
if(initPlayers && initGames) {
setPlayers(initPlayers); setGames(initGames);
} else {
(async()=>{
setSyncStatus(“saving”);
try {
const d = await jbRead(roomId, apiKey);
if(d && d.players) { setPlayers(d.players||[]); setGames(d.games||[]); }
setSyncStatus(“ok”);
setTimeout(()=>setSyncStatus(“idle”),2000);
} catch(e) { setSyncStatus(“err”); }
})();
}
}, []);

const update = async (p, g) => {
setPlayers(p); setGames(g);
setSyncStatus(“saving”);
try {
await jbWrite(roomId, apiKey, { players:p, games:g });
setSyncStatus(“ok”);
setTimeout(()=>setSyncStatus(“idle”),2000);
} catch(e) {
setSyncStatus(“err”);
notify(“Szinkronizálási hiba!”, true);
}
};

const addPlayer = () => {
const name = newName.trim(); if (!name) return;
if (players.find(p=>p.name.toLowerCase()===name.toLowerCase())) { notify(“Már létezik!”,true); return; }
update([…players,{id:Date.now().toString(),name}], games);
setNewName(””); notify(`${name} hozzáadva ✓`);
};
const delPlayer = id => update(players.filter(p=>p.id!==id), games);

const cfg = CONFIGS[pc]; const slots = cfg.slots;
const used = Object.values(assign).filter(Boolean);
const allOk = slots.every((_,i)=>assign[i]) && used.length===new Set(used).size && winner;

const doGameSave = () => {
if (!allOk) return;
const ng = { id:Date.now().toString(), date, pc, winTeam:winner,
rounds: rounds ? parseInt(rounds) : null,
assignments:slots.map((role,i)=>({pid:assign[i],role})) };
update(players, [ng,…games]);
setAssign({}); setWinner(””); setRounds(””); setView(“lb”); notify(“Játék mentve ✓”);
};
const delGame = id => update(players, games.filter(g=>g.id!==id));

// Manuel szinkronizálás
const doSync = async () => {
if(!apiKey||!roomId) return;
setSyncStatus(“saving”);
try {
const d = await jbRead(roomId, apiKey);
if(d && d.players && d.games) {
setPlayers(d.players); setGames(d.games);
}
setSyncStatus(“ok”);
setLastSync(new Date().toLocaleTimeString(“hu-HU”,{hour:“2-digit”,minute:“2-digit”}));
setTimeout(()=>setSyncStatus(“idle”),2000);
} catch(e) {
setSyncStatus(“err”);
notify(“Szinkronizálási hiba!”, true);
}
};

// Auto-szinkronizálás 30 másodpercenként
useEffect(()=>{
const id = setInterval(doSync, 30000);
return ()=>clearInterval(id);
}, []);

const lb = buildLB(players, games);
const medals = [“🥇”,“🥈”,“🥉”];

return (
<div style={S.root}>
<style>{CSS}</style>

      color:toast.err?"#f08080":"#80c880",padding:"9px 20px",borderRadius:6,
      fontFamily:"'Playfair Display',serif",fontSize:14,zIndex:9999,

    {view==="lb"&&(

        <h2 style={S.sh}>Végeredmény</h2>

            return (

                              <span style={{color:"#3a2810",fontSize:12,padding:"0 6px"}}>vs</span>

                              <span style={{color:(!aDom&&!tied)?"#e8b84b":"#5a4020",flex:1,fontSize:13,fontWeight:(!aDom&&!tied)?700:400,textAlign:"right"}}>{r.bName}</span>
                            </div>
                            <div style={{marginTop:4,height:5,background:"#1a1208",borderRadius:3,overflow:"hidden",display:"flex"}}>
                              <div style={{width:`${r.total>0?r.aW/r.total*100:50}%`,background:"#e8b84b",transition:"width .4s"}}/>
                              <div style={{flex:1,background:"#c07030"}}/>
                            </div>
                          </div>
                        );
                      })}
                    </Sec>

                    <Sec title="🏆 Örök rivális — legtöbb egymás elleni meccs">
                      {rivalries.slice(0,3).map((r,i)=>{
                        const leader = r.aW>r.bW?r.aName:r.bW>r.aW?r.bName:"Döntetlen";
                        return (
                          <div key={i} style={{padding:"6px 10px",marginBottom:4,background:"#0e0a05",
                            borderRadius:6,border:"1px solid #2a1808"}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                              <span style={{color:"#c8a060",fontSize:13}}>{r.aName} vs {r.bName}</span>
                              <span style={{color:"#5a3a18",fontSize:11}}>{r.total} meccs</span>
                            </div>
                            <div style={{color:"#50c878",fontSize:12,marginTop:2}}>
                              {r.aW===r.bW?"⚖️ Döntetlen":r.aW>r.bW?`🏅 ${r.aName} vezet ${r.aW}–${r.bW}`:`🏅 ${r.bName} vezet ${r.bW}–${r.aW}`}
                            </div>
                          </div>
                        );
                      })}
                    </Sec>
                  </>);
                })()}

                {/* Seriff-Bandita kombináció */}
                {(()=>{
                  const combos={};
                  games.forEach(g=>{
                    const sA = g.assignments.find(a=>a.role==="seriff");
                    const bAs = g.assignments.filter(a=>a.role==="bandita");
                    if(!sA||bAs.length===0) return;
                    const sName = players.find(p=>p.id===sA.pid)?.name;
                    if(!sName) return;
                    bAs.forEach(b=>{
                      const bName=players.find(p=>p.id===b.pid)?.name; if(!bName) return;
                      const key=`${sName}|${bName}`;
                      if(!combos[key]) combos[key]={seriff:sName,bandita:bName,p:0,seriffWin:0,banditaWin:0};
                      combos[key].p++;
                      if(g.winTeam==="seriff") combos[key].seriffWin++;
                      if(g.winTeam==="bandita") combos[key].banditaWin++;
                    });
                  });
                  const top = Object.values(combos).filter(c=>c.p>=2).sort((a,b)=>b.p-a.p).slice(0,5);
                  if(!top.length) return null;
                  return (
                    <Sec title="🤠💀 Seriff–Bandita kombináció — ki harcol legtöbbször egymás ellen?">
                      {top.map((c,i)=>(
                        <div key={i} style={{padding:"7px 0",borderBottom:"1px solid #1a1206"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                            <span style={{color:"#e8b84b",fontSize:12}}>🤠 {c.seriff}</span>
                            <span style={{color:"#3a2810",fontSize:11}}>vs</span>
                            <span style={{color:"#e05050",fontSize:12}}>💀 {c.bandita}</span>
                            <span style={{color:"#3a2810",fontSize:11,marginLeft:"auto"}}>{c.p}×</span>
                          </div>
                          <div style={{display:"flex",gap:6}}>
                            <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,
                              background:"#1e1608",border:"1px solid #4a3a10",color:"#e8b84b"}}>
                              🤠 Seriff nyert: {c.seriffWin}×
                            </span>
                            <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,
                              background:"#1e0808",border:"1px solid #5a1a1a",color:"#e05050"}}>
                              💀 Bandita nyert: {c.banditaWin}×
                            </span>
                          </div>
                        </div>
                      ))}
                    </Sec>
                  );
                })()}

                {/* Tökéletes sorozat + Grand Slam */}
                {(()=>{
                  // Tökéletes sorozat: valaha ért el 3+ nyerő sorozatot
                  const perfStreaks = lb.map(p=>{
                    let best=0, cur=0;
                    [...p.scoreHistory].forEach(h=>{
                      if(h.pts>0) { cur++; best=Math.max(best,cur); }
                      else cur=0;
                    });
                    return {name:p.name, best};
                  }).filter(p=>p.best>=3).sort((a,b)=>b.best-a.best);

                  // Grand Slam: nyert-e mindhárom csapatszínnel
                  const grandSlam = lb.map(p=>{
                    const wonTeams = new Set();
                    games.forEach(g=>{
                      const a=g.assignments.find(x=>x.pid===p.id);
                      if(a && calcPts(a.role,g.winTeam,g.pc)>0) wonTeams.add(g.winTeam);
                    });
                    return {name:p.name, wonTeams: [...wonTeams], complete: wonTeams.size===3};
                  });
                  const slammers = grandSlam.filter(p=>p.complete);
                  const inProgress = grandSlam.filter(p=>!p.complete&&p.wonTeams.length>=1);

                  return (<>
                    {perfStreaks.length>0&&(
                      <Sec title="🔥 Tökéletes sorozat — valaha elért 3+ nyerő sorozat">
                        {perfStreaks.map((p,i)=>(
                          <div key={i} style={{display:"flex",alignItems:"center",gap:8,
                            padding:"5px 0",borderBottom:"1px solid #1a1206"}}>
                            <span style={{color:"#c8a060",flex:1,fontSize:13}}>{p.name}</span>
                            <span style={{fontFamily:"'Rye',serif",color:"#e8b84b",fontSize:18}}>{p.best}🔥</span>
                            <span style={{color:"#5a3a18",fontSize:11}}>legjobb sorozat</span>
                          </div>
                        ))}
                      </Sec>
                    )}
                    <Sec title="🏆 Grand Slam — nyert mindhárom csapatszínnel?">
                      {slammers.length>0&&(
                        <div style={{marginBottom:10}}>
                          <div style={{color:"#50c878",fontSize:12,marginBottom:6}}>✅ Teljesítette:</div>
                          {slammers.map((p,i)=>(
                            <div key={i} style={{display:"flex",alignItems:"center",gap:6,
                              padding:"4px 0",borderBottom:"1px solid #0a2a0a"}}>
                              <span style={{color:"#50c878",fontSize:16}}>🏆</span>
                              <span style={{color:"#80d080",fontSize:13,fontWeight:700}}>{p.name}</span>
                              <div style={{marginLeft:"auto",display:"flex",gap:4}}>
                                {["seriff","bandita","renegat"].map(t=>(
                                  <span key={t} style={{fontSize:16}}>{WIN_TEAMS[t].icon}</span>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                      {slammers.length===0&&<div style={{color:"#3a2810",fontSize:12,marginBottom:8}}>Még senki sem teljesítette.</div>}
                      {inProgress.length>0&&(
                        <div>
                          <div style={{color:"#7a5a28",fontSize:12,marginBottom:6}}>⏳ Folyamatban:</div>
                          {inProgress.map((p,i)=>(
                            <div key={i} style={{display:"flex",alignItems:"center",gap:6,
                              padding:"4px 0",borderBottom:"1px solid #1a1206"}}>
                              <span style={{color:"#c8a060",fontSize:13}}>{p.name}</span>
                              <div style={{marginLeft:"auto",display:"flex",gap:4}}>
                                {["seriff","bandita","renegat"].map(t=>(
                                  <span key={t} style={{fontSize:16,opacity:p.wonTeams.includes(t)?1:0.2}}>
                                    {WIN_TEAMS[t].icon}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </Sec>
                  </>);
                })()}

                {/* Visszavágó arány */}
                {(()=>{
                  // Minden játékosnál: az előző játékban veszített → következőben nyert-e?
                  const comebacks = lb.filter(p=>p.played>=3).map(p=>{
                    const myGames = [...games].reverse().filter(g=>
                      g.assignments.some(a=>a.pid===p.id)
                    );
                    let chances=0, wins=0;
                    for(let i=0;i<myGames.length-1;i++){
                      const prev = myGames[i];
                      const next = myGames[i+1];
                      const prevA = prev.assignments.find(a=>a.pid===p.id);
                      if(!prevA) continue;
                      const prevWon = calcPts(prevA.role,prev.winTeam,prev.pc)>0;
                      if(!prevWon){
                        chances++;
                        const nextA = next.assignments.find(a=>a.pid===p.id);
                        if(nextA && calcPts(nextA.role,next.winTeam,next.pc)>0) wins++;
                      }
                    }
                    if(chances<2) return null;
                    return {name:p.name, wins, chances, pct:Math.round(wins/chances*100)};
                  }).filter(Boolean).sort((a,b)=>b.pct-a.pct);

                  if(!comebacks.length) return null;
                  return (
                    <Sec title="🥊 Visszavágó arány — vereség után a következő játékban nyer-e?">
                      <div style={{color:"#5a3a18",fontSize:11,marginBottom:8}}>
                        Csak olyan játékok ahol az előző játékot elveszítette.
                      </div>
                      {comebacks.map((c,i)=>(
                        <Row key={i}>
                          <span style={{color:"#c8a060",flex:1,fontSize:13}}>{c.name}</span>
                          <span style={{color:"#4a3018",fontSize:11,minWidth:42}}>{c.wins}/{c.chances}</span>
                          <Bar won={c.wins} played={c.chances} color={c.pct>=50?"#50c878":"#e05050"}/>
                        </Row>
                      ))}
                    </Sec>
                  );
                })()}

                {/* Ki billenti fel az egyensúlyt */}
                {(()=>{
                  if(games.length<4) return null;
                  // Minden játékosnál: azokban a játékokban ahol ő játszik,
                  // melyik csapatszín nyer szignifikánsan többet vs az összes játékban
                  const total = games.length;
                  const globalTw = {seriff:0,bandita:0,renegat:0};
                  games.forEach(g=>{ globalTw[g.winTeam]=(globalTw[g.winTeam]||0)+1; });

                  const tilters = lb.filter(p=>p.played>=3).map(p=>{
                    const myGames = games.filter(g=>g.assignments.some(a=>a.pid===p.id));
                    const myTw = {seriff:0,bandita:0,renegat:0};
                    myGames.forEach(g=>{ myTw[g.winTeam]=(myTw[g.winTeam]||0)+1; });
                    const n = myGames.length;

                    // Melyik csapatnál a legnagyobb az eltérés a globálishoz képest?
                    let maxDiff=0, tiltTeam=null;
                    Object.entries(myTw).forEach(([team,cnt])=>{
                      const myPct   = cnt/n;
                      const allPct  = (globalTw[team]||0)/total;
                      const diff    = myPct - allPct;
                      if(Math.abs(diff)>Math.abs(maxDiff)){
                        maxDiff=diff; tiltTeam=team;
                      }
                    });
                    if(!tiltTeam || Math.abs(maxDiff)<0.12) return null;
                    const myPct  = Math.round((myTw[tiltTeam]||0)/n*100);
                    const allPct = Math.round((globalTw[tiltTeam]||0)/total*100);
                    return {name:p.name, team:tiltTeam, myPct, allPct, diff:Math.round(maxDiff*100), played:n};
                  }).filter(Boolean).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));

                  if(!tilters.length) return null;
                  return (
                    <Sec title="⚖️ Ki billenti fel az egyensúlyt?">
                      <div style={{color:"#5a3a18",fontSize:11,marginBottom:8}}>
                        Ha ez a játékos játszik, az adott csapat szignifikánsan többet nyer a globális átlaghoz képest.
                      </div>
                      {tilters.slice(0,5).map((t,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,
                          padding:"6px 0",borderBottom:"1px solid #1a1206"}}>
                          <span style={{color:"#c8a060",flex:1,fontSize:13}}>{t.name}</span>
                          <span style={{color:WIN_TEAMS[t.team].color,fontSize:12}}>
                            {WIN_TEAMS[t.team].icon} {WIN_TEAMS[t.team].label}
                          </span>
                          <span style={{fontSize:12,color:t.diff>0?"#50c878":"#e05050",
                            fontFamily:"'Rye',serif",minWidth:60,textAlign:"right"}}>
                            {t.myPct}% vs {t.allPct}%
                          </span>
                        </div>
                      ))}
                    </Sec>
                  );
                })()}

                {/* Legkiegyensúlyozottabb nap */}
                {(()=>{
                  // Napok ahol legalább 3 játék volt, és a legtöbb különböző csapat nyert
                  const byDay = {};
                  games.forEach(g=>{
                    if(!byDay[g.date]) byDay[g.date]={games:0,teams:{}};
                    byDay[g.date].games++;
                    byDay[g.date].teams[g.winTeam]=(byDay[g.date].teams[g.winTeam]||0)+1;
                  });
                  const days = Object.entries(byDay)
                    .filter(([,v])=>v.games>=3)
                    .map(([date,v])=>{
                      const teamCounts = Object.values(v.teams);
                      const uniqueTeams = Object.keys(v.teams).length;
                      // Egyensúly = minél több különböző győztes, minél kisebb a szórás
                      const max = Math.max(...teamCounts);
                      const balance = uniqueTeams*10 - max; // magasabb = egyensúlyosabb
                      return {date, games:v.games, uniqueTeams, teams:v.teams, balance};
                    })
                    .sort((a,b)=>b.balance-a.balance);

                  if(!days.length) return null;
                  const best = days[0];
                  return (
                    <Sec title="🎯 Legkiegyensúlyozottabb nap — legtöbb különböző győztes csapat">
                      <div style={{padding:"10px 12px",background:"#0e0a05",borderRadius:6,
                        border:"1px solid #2a1808"}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                          <span style={{color:"#e8b84b",fontFamily:"'Rye',serif",fontSize:16}}>{best.date}</span>
                          <span style={{color:"#5a3a18",fontSize:12}}>{best.games} játék</span>
                        </div>
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          {Object.entries(best.teams).map(([team,cnt])=>(
                            <span key={team} style={{padding:"3px 10px",borderRadius:20,fontSize:12,
                              background:WIN_TEAMS[team].color+"22",
                              border:`1px solid ${WIN_TEAMS[team].color}55`,
                              color:WIN_TEAMS[team].color}}>
                              {WIN_TEAMS[team].icon} {WIN_TEAMS[team].label}: {cnt}×
                            </span>
                          ))}
                        </div>
                      </div>
                      {days.length>1&&(
                        <div style={{marginTop:8,color:"#3a2810",fontSize:11}}>
                          Többi kiegyensúlyozott nap: {days.slice(1,3).map(d=>d.date).join(", ")}
                        </div>
                      )}
                    </Sec>
                  );
                })()}

                {/* Ki nyerte meg a legtöbb játékot seriffként */}
                {(()=>{
                  const seriffWins = {};
                  games.forEach(g=>{
                    if(g.winTeam!=="seriff") return;
                    const sA = g.assignments.find(a=>a.role==="seriff");
                    if(!sA) return;
                    const name = players.find(p=>p.id===sA.pid)?.name;
                    if(!name) return;
                    seriffWins[name] = (seriffWins[name]||0)+1;
                  });
                  const rows = Object.entries(seriffWins).sort(([,a],[,b])=>b-a);
                  if(!rows.length) return null;
                  const max = rows[0][1];
                  return (
                    <Sec title="🤠 Legtöbb seriff győzelem — ki nyerte meg a legtöbb játékot seriffként?">
                      {rows.map(([name,cnt],i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:10,
                          padding:"6px 0",borderBottom:"1px solid #1a1206"}}>
                          {i===0&&<span style={{fontSize:18}}>🥇</span>}
                          {i===1&&<span style={{fontSize:18}}>🥈</span>}
                          {i===2&&<span style={{fontSize:18}}>🥉</span>}
                          {i>2&&<span style={{width:22,textAlign:"center",color:"#3a2010",
                            fontSize:12,fontFamily:"'Rye',serif"}}>#{i+1}</span>}
                          <span style={{color:"#c8a060",flex:1,fontSize:13}}>{name}</span>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            {Array.from({length:cnt}).map((_,j)=>(
                              <span key={j} style={{fontSize:14}}>⭐</span>
                            ))}
                            <span style={{fontFamily:"'Rye',serif",color:"#e8b84b",
                              fontSize:18,marginLeft:4}}>{cnt}×</span>
                          </div>
                        </div>
                      ))}
                    </Sec>
                  );
                })()}

                {/* Szimmetria mutató */}
                {(()=>{
                  if(players.length<2) return null;
                  // Minden játékosnál: mennyire egyenlő a szerepek elosztása
                  // Tökéletes szimmetria = minden szerepet egyforma arányban kapja
                  const symData = lb.filter(p=>p.played>=3).map(p=>{
                    const total = Object.values(p.roles).reduce((s,x)=>s+x,0);
                    if(total===0) return null;
                    const expected = total / Object.keys(ROLES).length;
                    // Szórás a szerepek eloszlásában
                    const allRoleCounts = Object.keys(ROLES).map(r=>p.roles[r]||0);
                    const variance = allRoleCounts.reduce((s,x)=>s+(x-expected)**2,0)/allRoleCounts.length;
                    const std = Math.sqrt(variance);
                    const symScore = Math.max(0, Math.round((1 - std/Math.max(total,1))*100));
                    return {name:p.name, symScore, played:total,
                      roles: Object.keys(ROLES).map(r=>({role:r,cnt:p.roles[r]||0,pct:Math.round((p.roles[r]||0)/total*100)}))
                    };
                  }).filter(Boolean).sort((a,b)=>b.symScore-a.symScore);

                  if(!symData.length) return null;
                  return (
                    <Sec title="🎲 Szimmetria mutató — mennyire egyenlően osztják a szerepeket?">
                      <div style={{color:"#5a3a18",fontSize:11,marginBottom:8}}>
                        100% = minden szerepet egyforma arányban kapott. Minél magasabb, annál sokoldalúbb.
                      </div>
                      {symData.map((p,i)=>(
                        <div key={i} style={{marginBottom:8,padding:"8px 10px",background:"#0e0a05",borderRadius:6,border:"1px solid #2a1808"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                            <span style={{color:"#c8a060",flex:1,fontSize:13,fontWeight:700}}>{p.name}</span>
                            <span style={{fontFamily:"'Rye',serif",
                              color:p.symScore>=70?"#50c878":p.symScore>=40?"#e8b84b":"#e05050",
                              fontSize:18}}>{p.symScore}%</span>
                          </div>
                          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                            {p.roles.map(({role,cnt,pct})=>(
                              <span key={role} style={{fontSize:11,padding:"2px 7px",borderRadius:10,
                                background:ROLES[role].dark,color:ROLES[role].color,
                                border:`1px solid ${ROLES[role].color}44`}}>
                                {ROLES[role].icon} {cnt}× ({pct}%)
                              </span>
                            ))}
                          </div>
                        </div>
                      ))}
                    </Sec>
                  );
                })()}

                {/* Mindenki más csapaton — chaos meccsek */}
                {(()=>{
                  // Azok a meccsek ahol minden játékos különböző csapaton volt
                  // 5 fős esetén: Seriff(1) + Helyettes(1) = seriff, 2x Bandita = bandita, 1x Renegát = renegát
                  // "Chaos" = max különböző csapat egyszerre (mindenki más oldalon?)
                  // Valójában: hányszor fordult elő minden lehetséges csapatszín győzelem
                  // Inkább: hányszor volt olyan meccs ahol a seriff csapat csak 2 fős (5 fős)
                  // Egyedi meccs-összetételek száma
                  const compMap = {};
                  games.forEach(g=>{
                    // Csapat összetétel kulcs: ki volt melyik csapaton
                    const teams = {seriff:[], bandita:[], renegat:[]};
                    g.assignments.forEach(a=>{
                      const t = ROLES[a.role]?.team;
                      const name = players.find(p=>p.id===a.pid)?.name;
                      if(t&&name) teams[t].push(name);
                    });
                    // Rendezzük hogy azonos összetétel = azonos kulcs
                    const key = Object.entries(teams)
                      .map(([t,names])=>`${t}:${[...names].sort().join(",")}`)
                      .sort().join("|");
                    if(!compMap[key]) compMap[key]={teams, count:0, wins:{seriff:0,bandita:0,renegat:0}};
                    compMap[key].count++;
                    compMap[key].wins[g.winTeam]++;
                  });

                  const comps = Object.values(compMap).sort((a,b)=>b.count-a.count);
                  const uniqueCount = comps.length;
                  const mostCommon = comps[0];

                  if(comps.length===0) return null;
                  return (
                    <Sec title={`🎰 Meccs-összetételek — ${uniqueCount} egyedi kombináció ${games.length} meccsből`}>
                      <div style={{color:"#5a3a18",fontSize:11,marginBottom:10}}>
                        Legtöbbször előforduló összetételek:
                      </div>
                      {comps.slice(0,4).map((c,i)=>{
                        const topWinner = Object.entries(c.wins).sort(([,a],[,b])=>b-a)[0];
                        return (
                          <div key={i} style={{marginBottom:8,padding:"8px 10px",background:"#0e0a05",
                            borderRadius:6,border:"1px solid #2a1808"}}>
                            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                              <span style={{color:"#5a3a18",fontSize:11}}>{c.count}× lejátszva</span>
                              <span style={{color:WIN_TEAMS[topWinner[0]]?.color,fontSize:11}}>
                                {WIN_TEAMS[topWinner[0]]?.icon} {topWinner[1]}× nyerte
                              </span>
                            </div>
                            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                              {Object.entries(c.teams).filter(([,names])=>names.length>0).map(([team,names])=>(
                                <div key={team} style={{fontSize:11,padding:"3px 8px",borderRadius:10,
                                  background:WIN_TEAMS[team]?.color+"22",
                                  border:`1px solid ${WIN_TEAMS[team]?.color}44`,
                                  color:WIN_TEAMS[team]?.color}}>
                                  {WIN_TEAMS[team]?.icon} {names.join(" + ")}
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                      {uniqueCount>4&&(
                        <div style={{color:"#3a2810",fontSize:11,marginTop:4,textAlign:"center"}}>
                          + {uniqueCount-4} további egyedi összetétel
                        </div>
                      )}
                    </Sec>
                  );
                })()}

              </div>
            );
          })()}
        </>}
      </div>
    )}

    {/* ══ ÚJ JÁTÉK ══ */}
    {view==="new"&&(

              <div>

                <div style={S.label}>Körök száma (opcionális)</div>

                    borderRadius:4,padding:"7px 11px",fontSize:14,marginTop:6,width:90}}/>

            </div>
            <div style={S.label}>Szerepek kiosztása</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(182px,1fr))",gap:9,marginTop:7}}>
              {slots.map((role,i)=>{
                const r=ROLES[role]; const pts=ROLE_PTS[role]?.[pc]||r.base;
                return (
                  <div key={i} style={{padding:"11px 12px",borderRadius:6,
                    border:`1px solid ${r.color}44`,background:r.dark}}>
                    <div style={{display:"flex",justifyContent:"space-between",color:r.color,
                      fontSize:14,fontWeight:700,marginBottom:7}}>
                      <span>{r.icon} {r.label}</span>
                      <span style={{opacity:.7,fontSize:12}}>+{pts} pt</span>
                    </div>
                    <select value={assign[i]||""} onChange={e=>setAssign(p=>({...p,[i]:e.target.value}))}
                      style={{width:"100%",background:"#100c06",color:"#c8a060",

                      <option value="">— válassz —</option>
                      {players.map(p=>{

            </div>
            <div style={{marginTop:17}}>
              <div style={S.label}>Ki nyert?</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:7}}>

                  <button key={k} className="btn" onClick={()=>setWinner(k)}
                    style={{padding:"8px 15px",background:winner===k?wt.color+"22":"#1a1008",

              </div>
            </div>
            {allOk&&(
              <div className="fu" style={{marginTop:15,padding:13,border:"1px solid #3a2808",
                borderRadius:6,background:"#0e0a05"}}>

                  letterSpacing:2,textAlign:"center",marginBottom:9}}>✦ PONTOK ELŐNÉZETE ✦</div>
                {slots.map((role,i)=>{
                  const player=players.find(x=>x.id===assign[i]);
                  const pts=calcPts(role,winner,pc);
                  return (
                    <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",
                      borderBottom:"1px solid #1e1206",fontSize:13}}>
                      <span style={{color:ROLES[role].color,minWidth:93}}>{ROLES[role].icon} {ROLES[role].label}</span>
                      <span style={{color:"#c8a060",flex:1}}>{player?.name}</span>

            <button className="btn" onClick={doGameSave} disabled={!allOk}
              style={{marginTop:18,width:"100%",padding:"12px",
                background:"linear-gradient(180deg,#3a2208,#231504)",
                color:"#e8b84b",border:"1px solid #6a4010",borderRadius:5,

                boxShadow:"0 4px 18px #00000055",opacity:allOk?1:.4}}>
              💾 &nbsp;Játék Mentése

      </div>

    {/* ══ JÁTÉKOSOK ══ */}
    {view==="pl"&&(
      <div className="fu">
        <h2 style={S.sh}>Játékosok</h2>
        <div style={{display:"flex",gap:9,marginBottom:15}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addPlayer()}
            placeholder="Játékos neve..."
            style={{flex:1,background:"#1a1008",color:"#c8a060",border:"1px solid #3a2010",
              borderRadius:4,padding:"8px 12px",fontSize:15}}/>
          <button className="btn" onClick={addPlayer}
            style={{background:"#2a1a08",color:"#e8b84b",border:"1px solid #5a3a10",

        </div>
        {players.length===0?<Empty>Még nincsenek játékosok.</Empty>
          :players.map((p,i)=>{
            const st=lb.find(x=>x.id===p.id);
            return (
              <div key={p.id} className="hov sr"
                style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",
                  borderRadius:6,background:"#100c06",marginBottom:4,

                <span style={{fontSize:16,color:"#d0a860",flex:1}}>{p.name}</span>

      </div>

    {/* ══ ELŐZMÉNYEK ══ */}
    {view==="hist"&&(
      <div className="fu">
        <h2 style={S.sh}>Előzmények</h2>
        {games.length===0?<Empty>Még nincsenek mentett játékok.</Empty>
          :games.map((g,gi)=>{
            const wt=WIN_TEAMS[g.winTeam];
            return (
              <div key={g.id} className="sr"
                style={{padding:"12px 13px",borderRadius:6,background:"#100c06",marginBottom:6,
                  borderLeft:`3px solid ${wt.color}55`,animationDelay:`${gi*.05}s`}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                  flexWrap:"wrap",gap:6,marginBottom:8}}>

                  <button className="btn" onClick={()=>delGame(g.id)}
                    style={{background:"#2a0a0a",color:"#c05050",border:"1px solid #5a1a1a",
                      borderRadius:4,padding:"2px 7px",fontSize:11}}>✕ töröl</button>
                </div>
                {g.assignments.map((a,ai)=>{
                  const player=players.find(x=>x.id===a.pid);
                  const r=ROLES[a.role]; const pts=calcPts(a.role,g.winTeam,g.pc);
                  return (
                    <div key={ai} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,

              </div>
            );
          })

      </div>

const CSS = `@import url('https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:wght@400;700&display=swap'); *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:#0c0905} ::-webkit-scrollbar-thumb{background:#4a2e10;border-radius:2px} input,select,button,textarea{font-family:'Playfair Display',Georgia,serif} select option{background:#1a1008;color:#c8a060} .btn{transition:all .15s;cursor:pointer;border:none} .btn:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)} .btn:active:not(:disabled){transform:translateY(0)} .btn:disabled{opacity:.35;cursor:not-allowed} .hov:hover{background:rgba(232,184,75,.06)!important} @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}} @keyframes sr{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}} @keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}} .fu{animation:fu .25s ease both} .sr{animation:sr .22s ease both} .nb{position:relative} .nb::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#e8b84b;transform:scaleX(0);transition:transform .2s} .nb.on::after{transform:scaleX(1)}`;

const S = {
root:   { minHeight:“100vh”, background:“radial-gradient(ellipse at 50% 0%,#1a0e04 0%,#0c0905 55%,#080906 100%)”, fontFamily:”‘Playfair Display’,Georgia,serif”, color:”#c8a060” },
hdr:    { textAlign:“center”, padding:“22px 14px 14px”, borderBottom:“1px solid #2a1808”, background:“linear-gradient(180deg,#1e1006 0%,transparent 100%)” },
deco:   { color:”#3a2410”, fontSize:11, letterSpacing:7, marginBottom:3 },
title:  { fontFamily:”‘Rye’,serif”, fontSize:“clamp(50px,13vw,90px)”, color:”#e8b84b”, letterSpacing:8, lineHeight:1, textShadow:“0 0 50px #e8b84b2a,0 2px 0 #000”, margin:“5px 0 3px” },
sub:    { color:”#5a3a18”, fontSize:“clamp(9px,2.2vw,12px)”, letterSpacing:“clamp(4px,1.5vw,7px)” },
nav:    { display:“flex”, flexWrap:“wrap”, justifyContent:“center”, gap:1, padding:“0 5px”, background:”#0e0a05”, borderBottom:“1px solid #2a1808” },
navBtn: { background:“transparent”, fontSize:“clamp(11px,2.4vw,13px)”, padding:“10px clamp(6px,2vw,14px)”, letterSpacing:.5, cursor:“pointer”, transition:“color .15s”, fontFamily:”‘Playfair Display’,serif” },
main:   { maxWidth:700, margin:“0 auto”, padding:“22px 13px 54px” },
sh:     { fontFamily:”‘Rye’,serif”, color:”#c89030”, fontSize:18, letterSpacing:2, marginBottom:17, paddingBottom:9, borderBottom:“1px solid #2a1808” },
label:  { color:”#6a4a20”, fontSize:11, letterSpacing:2, textTransform:“uppercase” },
};

// ── ROOT KOMPONENS ────────────────────────────────────────────────────────────
function Root() {
const apiKey = HARDCODED_KEY;
const [roomId,   setRoomId]   = useState(localStorage.getItem(LS_ROOM)||””);
const [roomName, setRoomName] = useState(localStorage.getItem(LS_RNAME)||””);
const [initData, setInitData] = useState(null);

const handleJoin = (id, name, players, games) => {
setRoomId(id); setRoomName(name);
setInitData({players, games});
};

if(!roomId) return <RoomScreen apiKey={apiKey} onJoin={handleJoin}/>;

return <App
apiKey={apiKey}
roomId={roomId}
roomName={roomName}
initPlayers={initData?.players}
initGames={initData?.games}
onLeaveRoom={()=>{
localStorage.removeItem(LS_ROOM);
localStorage.removeItem(LS_RNAME);
setRoomId(””); setRoomName(””); setInitData(null);
}}
/>;
}

ReactDOM.createRoot(document.getElementById(“root”)).render(<Root/>);
</script>
